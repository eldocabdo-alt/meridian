<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Solid status bar by default: the page then starts BELOW the clock and fills the whole screen. The see-through
         "black-translucent" mode made iOS 26 hand the app a page 59pt shorter than the screen (dead strip under the tab
         bar). iOS reads this at launch, so it is chosen here from the saved theme / preference before anything renders:
         black bar for the dark theme, white (default) for light, black-translucent only if he opted into it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" id="sbs" />
    <script>
      ;(function () {
        try {
          var s = (JSON.parse(localStorage.getItem('meridian-v1') || '{}').state || {}).settings || {}
          var t = s.theme || 'dark'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var mode = localStorage.getItem('meridian-statusbar') || 'solid'
          document.getElementById('sbs').setAttribute('content', mode === 'immersive' ? 'black-translucent' : dark ? 'black' : 'default')
        } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <meta name="description" content="Meridian - time blocking and deep focus." />
    <link rel="icon" href="/meridian/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/meridian/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&family=Instrument+Serif:ital@0;1&display=swap"

    />
